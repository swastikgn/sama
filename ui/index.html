<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fff6e9" />
    <meta name="description" content="ಸಮ SAMA — Layer 4 TCP load balancer control plane" />
    <title>ಸಮ SAMA · Balancer Control</title>
    <script>
      // Set theme before first paint: system default, override persisted.
      try {
        var t = localStorage.getItem('sama-theme') || 'system';
        var dark =
          t === 'dark' ||
          (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
